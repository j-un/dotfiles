# LSP servers and formatters for nvim — remove this file to uninstall all
# fd, marksman, taplo, terraform-ls: ~/.config/mise/conf.d/cli.toml
# gopls/goimports are built with `go install`. mise installs `go` first only
# when it is listed here; a Go binary already on PATH is not shared across machines.
[tools]
go                                    = "latest"
"go:golang.org/x/tools/gopls"         = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"npm:typescript"                      = "latest"
"npm:typescript-language-server"      = "latest"
"npm:prettier"                        = "latest"
"npm:pyright"                         = "latest"
"npm:yaml-language-server"            = "latest"
"npm:vscode-langservers-extracted"    = "latest"
# Registry binary (aqua:astral-sh/ruff). Same `ruff` CLI, no pipx/uv.
ruff                                  = "latest"
